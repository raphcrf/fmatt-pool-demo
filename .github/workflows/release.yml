name: release

# Tag no formato <pacote>/vX.Y.Z publica o ZIP instalavel daquele pacote.
#   git tag sam-catalog/v1.0.0 && git push origin sam-catalog/v1.0.0
on:
  push:
    tags: ['*/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler pacote e versao da tag
        id: t
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          echo "pkg=${REF%%/*}"        >> "$GITHUB_OUTPUT"
          echo "version=${REF##*/v}"   >> "$GITHUB_OUTPUT"

      - name: O pacote existe?
        run: test -d "packages/${{ steps.t.outputs.pkg }}"

      - name: Lint — nada de cliente no pacote
        run: ./scripts/lint-package.sh "packages/${{ steps.t.outputs.pkg }}"

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build e pack
        working-directory: packages/${{ steps.t.outputs.pkg }}
        # --frozenKeys: um build nunca deve regerar sys_id em silencio.
        run: |
          npm install --no-audit --no-fund
          npx --no-install now-sdk build --frozenKeys
          npx --no-install now-sdk pack .

      - name: Publicar a release com o ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="${{ steps.t.outputs.pkg }}"
          VER="${{ steps.t.outputs.version }}"
          ZIP=$(ls packages/$PKG/target/*.zip | head -1)
          gh release create "${GITHUB_REF#refs/tags/}" "$ZIP" \
            --title "$PKG v$VER" \
            --notes "Pacote instalavel de \`$PKG\` v$VER.

**O ZIP carrega a calibragem do build.** Este artefato foi construido com os slots de instancia vazios: serve para testar o mecanismo de instalacao, nao para entregar a cliente. Para um cliente, calibrar conforme o PLAYBOOK e gerar o ZIP daquela instancia.

- [Como instalar pelo ZIP](https://github.com/${{ github.repository }}/blob/main/packages/$PKG/INSTALL-ZIP.md)
- [Playbook de calibragem](https://github.com/${{ github.repository }}/blob/main/packages/$PKG/PLAYBOOK.md)
- [Portal](https://raphcrf.github.io/fmatt-pool-demo/$PKG.html)"
