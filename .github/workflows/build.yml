name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: list
        name: Pacotes tocados por este push
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          ALL=$(ls -d packages/*/ 2>/dev/null | sed 's|/$||')

          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            DIRS="$ALL"
          else
            CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
            # Mexer no lint ou no workflow revalida todos os pacotes.
            if echo "$CHANGED" | grep -qE '^(scripts/|\.github/workflows/)'; then
              DIRS="$ALL"
            else
              DIRS=$(echo "$CHANGED" | grep '^packages/' | cut -d/ -f1,2 | sort -u)
            fi
          fi

          JSON=$(printf '%s\n' "$DIRS" | grep -v '^$' | jq -R . | jq -sc .)
          echo "packages=$JSON" >> "$GITHUB_OUTPUT"
          echo "pacotes: $JSON"

  package:
    needs: changed
    if: needs.changed.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint — nada de cliente no pacote
        run: ./scripts/lint-package.sh "${{ matrix.package }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sem package-lock no pacote: o package.json ja fixa @servicenow/sdk
      # numa versao exata, e um lock por pacote so atrapalharia a calibragem.
      - name: Instalar dependencias
        working-directory: ${{ matrix.package }}
        run: npm install --no-audit --no-fund

      # Build sem instancia: valida que o Fluent compila e gera os XMLs.
      - name: now-sdk build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-dist
          path: ${{ matrix.package }}/dist
          if-no-files-found: warn
