# Metadata do pacote. O portal e o CI leem este arquivo.
id: sam-catalog
name: Software and License Offerings
version: 1.0.0
status: active          # active | frozen | deprecated
owner: raphcrf
scope: global           # aplicacao custom em escopo global
scope_id: f54705066303755ab5405eed473962f5

summary: >
  Seis ofertas de catalogo, cinco flows e dois subflows para o ciclo de licencas de
  software sobre SAM Pro: requisicao, homologacao, atualizacao de versao, devolucao,
  importacao de relatorio de uso e requisicao de compra.

requires:
  plugins:
    - com.snc.samp            # Software Asset Management Professional
  sdk: "4.9.2"                # @servicenow/sdk fixado no package.json
  node: ">=20"
  releases_tested:            # preencher a cada instalacao validada
    - Zurich

# O que a aplicacao entrega depois de instalada. Obrigatorio em todo pacote:
# e o que o consumidor le antes de decidir se reaproveita.
delivers:
  - group: Ofertas de catalogo
    items:
      - "Software License Request — pedir licenca de software homologado"
      - "Software Approval Request — homologar software novo, com parecer de seguranca"
      - "Software Version or Edition Upgrade — subir versao ou edicao"
      - "Software License Return — devolver licenca e liberar o seat"
      - "Software Usage Report Import — subir relatorio de uso (M365, Autodesk, Visio, Project)"
      - "Software Purchase Request — pedir compra do que nao existe em contrato"
  - group: Automacao
    items:
      - "5 flows, um por oferta com atendimento automatico"
      - "2 subflows: Fulfillment Backbone e Entra Removal After Allocation Delete"
      - "3 actions: Provision Entra Group Membership, Release License Allocation, Process Software Usage Report"
      - "1 business rule: remove do grupo do Entra quando a alocacao e apagada"
      - "1 notificacao de pedido de aprovacao"
  - group: Modelo de dados
    items:
      - "2 tabelas de de-para: u_software_entra_group, u_software_usage_offering_map"
      - "4 tabelas de staging de importacao de uso"
      - "sc_req_item: coluna u_homologation_outcome"
      - "cmdb_software_product_model: coluna u_ad_group"
      - "samp_sw_subscription: 5 colunas de uso e atribuicao de seat"
  - group: Interface do catalogo
    items:
      - "4 variable sets compartilhados pelas ofertas"
      - "7 client scripts e 6 UI policies de catalogo"
      - "1 user criteria: License Management Team"
  - group: Codigo de servidor
    items:
      - "SoftwareLicenseCatalogUtils, SoftwareLicenseAvailability (AJAX), EntraGroupProvisioner, UniversalUsageImporter"
  - group: Testes
    items:
      - "ATF cobrindo submissao das seis ofertas, caminho de aprovacao e os importadores"

# Pre-requisitos que NAO viajam com o pacote.
requires_environment:
  - "Plugin SAM Pro (com.snc.samp)"
  - "Catalogo, categoria, user criteria e grupos — referenciados por sys_id, nao criados"
  - "Spoke, connection e credential do Entra, e o registro do lado do IdP"
  - "Dado: modelos homologados, entitlements, de-para de uso"

# O que um TC precisa ajustar depois do install.
post_install:
  - "Preencher as properties de ambiente (grupos e modelos)"
  - "Vincular as ofertas ao catalogo e a categoria, se veio por update set"
  - "Rodar o script de reconciliacao de layout (sys_ui_element nao viaja)"
  - "Limpar o selo generation_source dos flows"
  - "Conferir na instancia: 7 flows ativos e 6 ofertas com categoria"

# Tabelas globais que a aplicacao le ou estende. Espelha now.config.json.
touches:
  - alm_entitlement
  - alm_license
  - cmdb_model
  - cmdb_software_product_model
  - sc_cat_item
  - sc_req_item
  - sc_request
  - sc_task
  - samp_sw_subscription
  - sys_user
  - sys_user_group
  - sysapproval_approver
  - user_criteria

# Os nove slots de calibragem. build = gravado no XML, exige rebuild.
config:
  - key: SERVICE_CATALOG_SYS_ID
    file: src/fluent/shared/instance-refs.ts
    kind: build
    required: true
    what: catalogo onde as ofertas aparecem
  - key: CATEGORY.software
    file: src/fluent/shared/instance-refs.ts
    kind: build
    required: true
    what: categoria dentro do catalogo
  - key: GROUP.licenseManagement
    file: src/fluent/shared/instance-refs.ts
    kind: build
    required: true
    what: grupo de Gestao de Licencas
  - key: GROUP_LICENSE_MANAGEMENT
    file: src/fluent/shared/instance-refs.ts
    kind: build
    required: true
    what: o mesmo sys_id acima, como constante plana
  - key: USER_CRITERIA.allEmployees
    file: src/fluent/shared/instance-refs.ts
    kind: build
    required: true
    what: quem enxerga as ofertas
  - key: software_license_offerings.group_license_management
    file: src/fluent/properties/instance-bindings.now.ts
    kind: property
    required: true
    what: o mesmo sys_id do grupo, em runtime
  - key: software_license_offerings.group_information_security
    file: src/fluent/properties/instance-bindings.now.ts
    kind: property
    required: false
    what: grupo do parecer de seguranca na homologacao
  - key: visio_software_model
    file: src/fluent/import-sets/visio-usage-import.now.ts
    kind: build
    required: false
    what: modelo do Visio; sem ele o transform rejeita toda linha
  - key: project_software_model
    file: src/fluent/import-sets/project-usage-import.now.ts
    kind: build
    required: false
    what: modelo do Project; sem ele o transform rejeita toda linha

# Properties de comportamento, ajustaveis sem rebuild.
tunables:
  - software_license_offerings.manager_approval_enabled
  - software_license_offerings.entra_add_verify_wait_minutes
  - software_license_offerings.entra_remove_verify_wait_minutes
  - software_license_offerings.software_model_qualifier

deployments: []   # preencher: {cliente, instancia, versao, data} - sem sys_ids
